# Study cases — the only place a case is defined.
#
# Owner: Rol 3 (yuls). Consumed by pipeline/ (mock + real) and by the app's loaders.
# Contract: docs/data-contract-v1.md. Nothing here overrides the frozen schema; these are
# *parameters of a case*, not of the contract.
#
# `primary` is deliberately a single switch: the 48 h scope is "one case executed perfectly",
# and the informe (Málaga as control) and the README (Mexico City for signal) disagreed.
# DECISION PENDING TEAM CONFIRMATION — change one line here, nothing else.

schema_version: "1.0"

primary: mexico-city

cases:
  mexico-city:
    name: "Mexico City, MX"
    role: "primary — extreme differential subsidence"
    bbox: [-99.35, 19.20, -98.85, 19.65]          # [W, S, E, N], EPSG:4326
    aoi_polygon:                                   # closed ring, lon/lat; bbox by default
      - [-99.35, 19.20]
      - [-98.85, 19.20]
      - [-98.85, 19.65]
      - [-99.35, 19.65]
      - [-99.35, 19.20]
    crs_publish: EPSG:4326                         # artefacts are published in this CRS
    crs_analysis: EPSG:32614                       # UTM 14N — metric maths happens here
    reference_point: [-99.13, 19.43]               # InSAR reference pixel, lon/lat
    revisit_days: 12                               # of the declared product, never pooled
    expected_regime: inelastic
    published_rate_mm_yr: -450                     # Cigna & Tapete 2022, doi:10.1029/2022gl098923
    limitations:
      - "Lacustrine clay, closed basin: rates are not transferable to the other two cities."
      - "GUNW posting 80 m: city scale, not building scale."
    mock:                                          # parameters of the synthetic field only
      peak_velocity_mm_yr: -420
      peak_lonlat: [-99.13, 19.43]
      falloff_km: 8.0
      noise_mm_yr: 8.0
      coverage_ellipse:                            # cells outside this are nodata (absent)
        center: [-99.10, 19.42]
        semi_axes_km: [24.0, 22.0]
        rotation_deg: 0
      seasonal_amplitude_mm: 9.0

  jakarta:
    name: "Jakarta, ID"
    role: "second site — coastal, mixed regime"
    bbox: [106.70, -6.40, 107.00, -6.10]
    aoi_polygon:
      - [106.70, -6.40]
      - [107.00, -6.40]
      - [107.00, -6.10]
      - [106.70, -6.10]
      - [106.70, -6.40]
    crs_publish: EPSG:4326
    crs_analysis: EPSG:32748                       # UTM 48S
    reference_point: [106.85, -6.21]
    revisit_days: 12
    expected_regime: mixed
    published_rate_mm_yr: -50
    limitations:
      - "Not the capital-planning case: ground truth is fragmented across agencies."
      - "Coastal: inundation, not just subsidence, drives the story."
    mock:
      peak_velocity_mm_yr: -300
      peak_lonlat: [106.85, -6.13]                 # north coast
      falloff_km: 6.0
      noise_mm_yr: 10.0
      coverage_ellipse:
        center: [106.85, -6.25]
        semi_axes_km: [13.0, 13.0]
        rotation_deg: 0
      seasonal_amplitude_mm: 12.0

  malaga:
    name: "Málaga, ES"
    role: "control — declared null result (EU, EGMS-eligible)"
    bbox: [-4.60, 36.60, -4.30, 36.85]
    aoi_polygon:
      - [-4.60, 36.60]
      - [-4.30, 36.60]
      - [-4.30, 36.85]
      - [-4.60, 36.85]
      - [-4.60, 36.60]
    crs_publish: EPSG:4326
    crs_analysis: EPSG:32630                       # UTM 30N
    reference_point: [-4.42, 36.72]
    revisit_days: 12
    expected_regime: elastic
    published_rate_mm_yr: -1.2
    # |median| < 5 mm/yr ⇒ meta.stats.detection_limit_mm_yr becomes mandatory (contract §5)
    null_result: true
    detection_limit_mm_yr: 1.5
    limitations:
      - "Rates are at or below the detection floor: the bound IS the result."
      - "Do not present flatness as absence of aquifer stress — it is a compressibility result."
    mock:
      peak_velocity_mm_yr: -3.0
      peak_lonlat: [-4.44, 36.72]
      falloff_km: 9.0
      noise_mm_yr: 1.2
      coverage_ellipse:
        center: [-4.45, 36.72]
        semi_axes_km: [12.0, 11.0]
        rotation_deg: 0
      seasonal_amplitude_mm: 2.0

# Analysis constants shared by every case (they belong to the method, not to a city).
processing:
  h3_resolution: 9                                # ≈200 m edge — matches GUNW's 80 m posting scale
  coherence_min: 0.35                             # overridden per (sensor, product) by contracts.py
  k_sigma: 2.5
  min_area_m2: 500
  dates_start: "2026-07-02"                       # mock window; real dates come from the granules
  dates_step_days: 12
  dates_count: 12
